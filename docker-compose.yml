services:
  mongo:
    image: mongo:7
    container_name: wakepulse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: wakepulse
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wakepulse-api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost
      MONGODB_URI: mongodb://mongo:27017/wakepulse
      MONGODB_DB_NAME: wakepulse
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_MS: 30000
      SCHEDULER_MAX_CONCURRENCY: 5
    ports:
      - "5000:5000"

  web:
    image: nginx:1.27-alpine
    container_name: wakepulse-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro

volumes:
  mongo_data:
